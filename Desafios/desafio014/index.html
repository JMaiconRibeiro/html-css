<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.1em;
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        .notas {
            text-align: center;
            font-weight: lighter;
        }

        #notasmedias {
            text-align: center;
            font-weight: bold;
        }

        .materias {
            font-weight: lighter;
        }

        .th {
            background-color: gray;
            color: white;
        }

        .medias {
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="th" rowspan="2" scope="col">Área</th>
                <th class="th" rowspan="2" scope="col">Disciplinas</th>
                <th class="th" colspan="2" scope="colgroup">Notas</th>
                <th class="th" rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th class="th" scope="col">Nota 1</th>
                <th class="th" scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td class="materias">Matemática</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td class="materias">Física</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td class="materias">Química</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td class="materias">Biologia</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <th class="th medias" colspan="4" scope="row">Média de Exatas</th>
                <td class="th notas" id="notasmedias">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td class="materias">História</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td class="materias">Geografia</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <th class="th medias" colspan="4" scope="row">Média de Humanas</th>
                <td class="th notas" id="notasmedias">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
